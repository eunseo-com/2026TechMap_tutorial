name: Deploy DocC

on:
  push:
    branches: [main]
    paths:
      - "Tutorials/SceneKitToRealityKit.docc/**"
      - "Web/index.html"
      - "scripts/build-docc-site.sh"
      - "scripts/verify-docc-site.sh"
      - ".github/workflows/deploy-docc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build DocC archive
        run: bash scripts/build-docc-site.sh "$RUNNER_TEMP/docc-site"
      - name: Verify DocC routes, links, locale, and accessibility metadata
        run: bash scripts/verify-docc-site.sh "$RUNNER_TEMP/docc-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/docc-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
