name: Deploy DocC

on:
  push:
    branches: [main]
    paths:
      - "Tutorials/SceneKitToRealityKit.docc/**"
      - "Web/index.html"
      - "Web/docc-accessibility-fixes.js"
      - "scripts/build-docc-site.sh"
      - "scripts/verify-docc-content.sh"
      - "scripts/verify-docc-browser.mjs"
      - "scripts/verify-docc-site.sh"
      - "scripts/tests/verify-docc-browser-contract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-docc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify DocC content and snippets
        run: bash scripts/verify-docc-content.sh
      - name: Build DocC archive
        run: bash scripts/build-docc-site.sh "$RUNNER_TEMP/docc-site"
      - name: Verify DocC routes, links, locale, and accessibility metadata
        run: bash scripts/verify-docc-site.sh "$RUNNER_TEMP/docc-site"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install rendered-browser verifier
        run: npm ci --ignore-scripts
      - name: Install pinned Chromium
        run: npm exec playwright -- install chromium
      - name: Verify rendered-browser failure contracts
        run: npm run test:docc-browser
      - name: Verify rendered DocC routes and accessibility
        run: npm run verify:docc-browser -- "$RUNNER_TEMP/docc-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/docc-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
